format_official = true
notes = "Uploaded to evisa.gov.vn as JPEG under 2 MB, 4x6 cm, white background, no hat and no glasses. Vietnam publishes no head height, so the framing here follows the usual proportion for this size."

# Japan's current MOFA form says 35x45; the 45x45 everyone quotes is the 2012 form, which some
# posts (India, the United States, South Africa) still require. The head geometry is published
# by embassies rather than by MOFA: 34mm +/- 2 chin to crown, which is 75.6 % of 45mm.
[jp_visa]
name = "Japan Visa"
digital_width = 700
digital_height = 900
max_file_size_kb = 500
print_width_mm = 35
print_height_mm = 45
face_height_percent = 75.6
face_top_margin_percent = 8.9
eye_line_from_bottom_percent = 57.0
background = "white"
photo_count = 1
format = "jpeg"
notes = "35x45mm on the current MOFA form, head 34mm plus or minus 2 from chin to crown, white or plain background, taken within six months. Printed and glued to the form. Some posts still use the older 45x45mm form, and the eVISA is digital with no size at all."
