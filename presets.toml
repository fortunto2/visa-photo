# Spain's residence card, and unusually small: 26x32 mm rather than the 35x45 everything else
# uses, which is why a photo made for any other document is the wrong shape here. The numbers
# are published: head 70-80 % of the height, 23.5 mm to the top of the hair, 2 mm above it.
# Those work out to 73.4 % and 6.25 %. Submitted on photographic paper — the police do not take
# a digital file — so this preset exists to be printed, not uploaded.
[es_tie]
name = "Spain TIE (residence card)"
digital_width = 614
digital_height = 756
max_file_size_kb = 5000
print_width_mm = 26
print_height_mm = 32
face_height_percent = 73.5
face_top_margin_percent = 6.3
eye_line_from_bottom_percent = 60.5
background = "white"
photo_count = 2
format = "jpeg"
notes = "26x32mm on photographic paper — smaller than the 35x45mm used almost everywhere else. White background, no dark glasses, head 70-80% of the height."

# Thailand's e-Visa publishes no physical size at all — only a head share, a file ceiling and a
# minimum height in pixels, taken from the portal's own validator and the MFA manual. The
# 35x45mm every photo service quotes belongs to the paper visa Thailand replaced, and that
# process also had a different recency rule, so repeating it would be wrong twice.
[th_evisa]
name = "Thailand e-Visa"
digital_width = 600
digital_height = 800
digital_max_width = 3000
digital_max_height = 4000
max_file_size_kb = 3000
face_height_percent = 75.0
face_top_margin_percent = 6.0
eye_line_from_bottom_percent = 60.0
background = "white"
photo_count = 1
format = "jpeg"
format_official = true
notes = "Uploaded only, no printed size exists. JPEG under 3 MB, at least 160 px tall, light plain background, head 70-80% of the height, taken within six months."

# Saudi Arabia states one fixed pixel size and a genuine file-size corridor, and no millimetres.
# Their wording says the face fills "70% - 80% of the face", which is an error in their own
# copy; 1.4-1.6 inches of chin-to-crown on a 200 px photo is 70-80 % of its height, so that is
# what it means. The Enjaz route publishes nothing at all — its manual has no photo section.
[sa_evisa]
name = "Saudi Arabia e-Visa"
digital_width = 200
digital_height = 200
min_file_size_kb = 5
max_file_size_kb = 100
face_height_percent = 75.0
face_top_margin_percent = 8.0
eye_line_from_bottom_percent = 58.0
background = "white"
photo_count = 1
format = "jpeg"
notes = "Uploaded only, no printed size exists. Exactly 200x200 px, 5-100 KB, plain white background with no shadows, head 70-80% of the height, taken within six months."

# Vietnam states a size and a format and nothing about the head at all — no chin-to-crown, no
# eye line, no margins, no pixels. The 60 % below is our framing choice, not their rule, and
# the page says so. Their own portal contradicts itself on weight (<2 MB in the form note and
# the instructions, 10 MB on the printed request form); 2 MB is the safe reading.
[vn_evisa]
name = "Vietnam e-Visa"
digital_width = 600
digital_height = 900
max_file_size_kb = 2048
print_width_mm = 40
print_height_mm = 60
face_height_percent = 60.0
face_top_margin_percent = 12.0
eye_line_from_bottom_percent = 58.0
background = "white"
photo_count = 1
