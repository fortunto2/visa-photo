# ── New Zealand ──
# States ranges, not one size: 900-4500 wide, 1200-6000 high, and a file between 250 KB and
# 5 MB. The lower weight bound is the unusual part and the reason min_file_size_kb exists.
[nz_passport]
name = "New Zealand Passport"
digital_width = 900
digital_height = 1200
digital_max_width = 4500
digital_max_height = 6000
max_file_size_kb = 5000
min_file_size_kb = 250
# Tuned against their official checker, then restated. The accepted photo was made while the
# crown estimate ran 15 % low, so a preset reading 60 % was really putting a 70 % head in the
# frame; 71 % is that same photo, honestly labelled, and is also the floor of the 32-36mm in
# 45mm they publish. The one they refused as "taken too close" measured 83 %.
face_height_percent = 71.0
face_top_margin_percent = 8.0
eye_line_from_bottom_percent = 60.0
background = "white"
photo_count = 2
format = "jpeg"
notes = "3:4 portrait, 900-4500 px wide, file 250 KB to 5 MB, no selfies. A printed photo is 35x45mm and a different shape."

